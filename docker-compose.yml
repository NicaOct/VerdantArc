version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=verdantarc;Username=postgres;Password=postgres
    depends_on:
      - db
    volumes:
      - keys-data:/app/keys
      
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: verdantarc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
  keys-data:
